apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fitness-tracker
  namespace: argocd

spec:

  project: default

  source:
    repoURL: https://github.com/Pankaj0634/Fitness_Tracker_DevOps_Capstone.git

    targetRevision: develop

    path: fitness-chart

    helm:
      valueFiles:
      - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc

    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
    - CreateNamespace=true
